# À placer dans .github/workflows/metrics.yml du dépôt Whiplashhhh/Whiplashhhh
# Nécessite un secret METRICS_TOKEN (PAT classique, scope read:user + repo)
name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Whiplashhhh
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
